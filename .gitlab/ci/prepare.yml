prepare:
  extends: .node_bun_base
  stage: prepare
  cache:
    key:
      files:
        - bun.lock
      prefix: bun-cache
    paths:
      - .bun-cache
      - node_modules/
    policy: pull-push
  script:
    - BUN_INSTALL_CACHE_DIR="$CI_PROJECT_DIR/.bun-cache" bun install --frozen-lockfile --ignore-scripts
